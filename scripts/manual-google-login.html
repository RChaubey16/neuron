<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Neuron — manual Google login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        line-height: 1.5;
      }
      textarea {
        width: 100%;
        height: 6rem;
        font-family: monospace;
        font-size: 0.8rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      pre {
        background: #f4f4f4;
        padding: 0.75rem;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>Neuron — manual Google login</h1>
    <p>
      Dev-only page for Phase 2 manual verification. Not part of the app —
      just a way to get a real Supabase access token without a real
      frontend.
    </p>

    <button id="login">Sign in with Google</button>
    <p id="status"></p>

    <div id="result" style="display: none">
      <h2>Access token</h2>
      <textarea id="token" readonly></textarea>
      <h2>Try it</h2>
      <pre id="curl"></pre>
    </div>

    <script>
      // Client-safe values (anon key is meant to be embedded in frontend code).
      const SUPABASE_URL = 'https://wyfxsuifyrtjbfjtavyz.supabase.co';
      const SUPABASE_ANON_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5ZnhzdWlmeXJ0amJmanRhdnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDYxODcsImV4cCI6MjEwMzQ4MjE4N30.bHPq6l0-qSqUYP8F2FZH8OS5_aEmVzWESOsYPA-o2XI';
      const API_BASE_URL = 'http://localhost:3000';

      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        { auth: { flowType: 'implicit' } },
      );

      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const tokenEl = document.getElementById('token');
      const curlEl = document.getElementById('curl');

      document.getElementById('login').addEventListener('click', () => {
        supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.href },
        });
      });

      async function showSessionIfPresent() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();

        if (!session) {
          statusEl.textContent = 'Not signed in yet.';
          return;
        }

        statusEl.textContent = `Signed in as ${session.user.email}`;
        resultEl.style.display = 'block';
        tokenEl.value = session.access_token;
        curlEl.textContent = `curl -H "Authorization: Bearer ${session.access_token}" ${API_BASE_URL}/me`;
      }

      showSessionIfPresent();
    </script>
  </body>
</html>
