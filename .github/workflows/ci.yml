# Runs on every pull request to main and every push to main.
# `check` mirrors `pnpm check` locally, against the same Docker Compose services;
# `migrations` and `docker` catch what only shows up at deploy time.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a PR branch, but let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version from the root package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same Postgres, Redis (with noeviction, which BullMQ needs) and Mailpit
      # as local development. The tests create their own databases and apply the
      # migrations themselves.
      - name: Start Postgres, Redis and Mailpit
        run: docker compose up -d --wait

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format, lint, typecheck and test
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

  migrations:
    name: Migrations match the Prisma schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway database that Prisma replays the migrations into.
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: neuron
          POSTGRES_PASSWORD: neuron
          POSTGRES_DB: neuron_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuron -d neuron_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @neuron/db

      # Fails when schema.prisma has changes no migration covers. Fix it with
      # `pnpm --filter @neuron/db db:migrate`, and commit the new migration.
      - name: Check for schema changes without a migration
        run: pnpm --filter @neuron/db db:check-migrations
        env:
          SHADOW_DATABASE_URL: postgresql://neuron:neuron@localhost:5432/neuron_shadow

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Built from the repo root like Coolify does, but not pushed anywhere.
      - name: Build apps/${{ matrix.app }}/Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
